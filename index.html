<style>
  :root{
    --navy:#151515;
    --navy-2:#2A2A2A;
    --slate:#2A2A2A;
    --bg:#F7F6F0;
    --card:#FFFFFF;
    --line:#E7E2D2;
    --text:#1A1A1A;
    --muted:#736F60;
    --green:#1B8E5A;
    --green-bg:#E7F5EE;
    --red:#C0392B;
    --red-bg:#FBEAE8;
    --amber:#8A6D00;
    --amber-bg:#FFF3C4;
    --blue:#2A2A2A;
    --blue-bg:#ECEAE2;
    --brand:#8A6D00;
    --brand-bg:#FFE202;
    --brand-tint:#FFF3C4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 10%, rgba(255,226,2,0.14), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(255,226,2,0.08), transparent 50%),
    linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, #000 100%);}
  .login-logo{width:76px;height:76px;border-radius:16px;overflow:hidden;margin:0 0 18px;box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .login-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .login-card{background:var(--card);width:380px;max-width:90vw;border-radius:14px;padding:36px 32px;box-shadow:0 30px 60px rgba(10,15,30,0.35);}
  .login-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .login-title{font-size:22px;font-weight:700;margin:0 0 4px;color:var(--navy);}
  .login-sub{font-size:13px;color:var(--muted);margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;}
  .field input, select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
  .field input:focus, select:focus{outline:none;border-color:var(--slate);}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:transform .08s ease, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:transparent;color:var(--slate);border:1.5px solid var(--line);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:6px;}
  .err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:7px;font-size:12.5px;margin-bottom:14px;font-weight:500;}
  .login-hint{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:14px;}

  /* ---------- Shell ---------- */
  .topbar{background:var(--navy);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--brand-bg);}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text .t1{font-size:13px;font-weight:700;letter-spacing:.02em;}
  .brand-text .t2{font-size:11px;color:#AEB9D4;}
  .top-right{display:flex;align-items:center;gap:14px;}
  .today-pill{background:rgba(255,255,255,0.1);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .logout{color:#DCE3F5;font-size:12.5px;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;}

  .container{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--card);padding:5px;border-radius:10px;width:fit-content;border:1px solid var(--line);}
  .tab{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;}
  .tab.active{background:var(--navy);color:#fff;}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .stat-value{font-size:23px;font-weight:700;font-family:'Space Grotesk';}
  .stat-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .pos{color:var(--green);} .neg{color:var(--red);}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
  .panel h3{margin:0 0 16px;font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .panel h3 .cnt{background:var(--brand-tint);color:var(--brand);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}

  .row-flex{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .row-flex .field{margin-bottom:0;flex:1;min-width:150px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:13px;}
  td:first-child{border-left:1px solid var(--line);}
  tr:first-child td{border-top:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);font-size:13.5px;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:#FAFBFD;}
  .num{text-align:right;font-family:'IBM Plex Mono',monospace;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-gray{background:#EEF0F4;color:#7C8798;}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-blue{background:var(--blue-bg);color:var(--blue);}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}

  .meter{background:#EEF0F4;height:7px;border-radius:20px;overflow:hidden;width:100%;min-width:70px;}
  .meter-fill{height:100%;border-radius:20px;}

  .empty-note{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}

  .plan-set-box .amt{font-weight:700;font-size:16px;color:var(--navy);font-family:'IBM Plex Mono';}
  .link-btn{background:none;border:none;color:var(--slate);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit;}

  .loading{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .expand-row td{background:#FBFCFE;}

  .footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.7;}
  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .setup-card{max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;}
  .setup-card h2{margin:0 0 10px;color:var(--navy);}
  .setup-card code{background:#EEF0F4;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .setup-card ol{padding-left:20px;line-height:1.9;font-size:13.5px;}

  /* ---------- App-like mobile layer ---------- */
  input, select, button{ font-size:16px; } /* prevents iOS auto-zoom on focus */
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .btn{ min-height:46px; }
  .bottom-nav{
    display:none;
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:#fff; border-top:1px solid var(--line);

    box-shadow:0 -6px 20px rgba(10,15,30,0.06);
  }
  .bottom-nav-row{display:flex; gap:4px;}
  .bottom-nav-item{
    flex:1; border:none; background:none; font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:10px; color:var(--muted); font-size:11px; font-weight:600;
  }
  .bottom-nav-item .ic{font-size:18px; line-height:1;}
  .bottom-nav-item.active{color:var(--navy); background:var(--brand-tint);}

  .town-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
  .town-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:14px 14px; text-align:left; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; gap:8px; min-height:96px; position:relative;
  }
  .town-card:active{ transform:scale(0.98); }
  .town-card .tc-name{font-weight:700; font-size:14.5px; color:var(--text); padding-right:60px;}
  .town-card .tc-nums{display:flex; justify-content:space-between; font-size:12px; color:var(--muted);}
  .town-card .tc-nums b{color:var(--text); font-family:'IBM Plex Mono';}
  .town-card .tc-badge{position:absolute; top:12px; right:12px;}

  .entry-screen-header{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back-btn{
    background:var(--brand-tint); color:var(--navy); border:none; width:38px; height:38px;
    border-radius:10px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .entry-screen-header h2{margin:0; font-size:17px; color:var(--navy);}

  .amount-input-lg{
    width:100%; padding:16px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--navy);
  }
  .amount-input-lg:focus{outline:none; border-color:var(--slate);}

  @media(max-width:720px){
    .topbar{padding:12px 16px;}
    .container{padding:14px 12px 96px;}
    .tabs.desktop-tabs{display:none;}
    .bottom-nav{display:block;}
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .stat-value{font-size:19px;}
    table.responsive-table thead{display:none;}
    table.responsive-table, table.responsive-table tbody, table.responsive-table tr, table.responsive-table td{display:block; width:100%;}
    table.responsive-table tr{border:1px solid var(--line); border-radius:10px; margin-bottom:10px; padding:6px 4px; background:#fff;}
    table.responsive-table td{border-bottom:none; display:flex; justify-content:space-between; align-items:center; padding:7px 10px;}
    table.responsive-table td::before{content:attr(data-label); font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;}
    table.responsive-table td.num{text-align:right;}
    table.responsive-table tr.expand-row{border:none; margin:0; padding:0; background:none;}
    table.responsive-table tr.expand-row td{display:block; padding:0;}
    table.responsive-table tr.expand-row td::before{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= SUPABASE CONFIG ============================= */
// Paste your project's values here (Supabase dashboard > Project Settings > API).
// SUPABASE_ANON_KEY is safe to expose in client-side code by design — it's
// restricted by the Row Level Security policies set up in supabase_schema.sql.
const SUPABASE_URL = 'https://nqxljjrkafcjfxjpfcao.supabase.co';       // e.g. https://abcxyz.supabase.co
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xeGxqanJrYWZjamZ4anBmY2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTUzMTUsImV4cCI6MjEwMDM3MTMxNX0.IeF-JviusILsTdBMOGMwWpyrdTSLPdDHxn_TUdpbxoo';

const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
const sb = SUPABASE_CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================= DATA MODEL ============================= */
const TOWN_DATA = {
  yaqoob:  { name:'Yaqoob Magnejo',  towns:['Hyderabad','Mirpurkhas','Nawabshah','Sukkur','Larkana','Quetta','Rahimyar Khan','Sadiqabad','Khairpur','Turbat'] },
  jamal:   { name:'Jamal e Rabbi',   towns:['Multan','Dera Ghazi Khan','Muzaffargarh','Bahawalnagar','Chishtian','Bahawalpur','Ahmedpur East','Mian Channu','Vehari','Karachi'] },
  danish:  { name:'Danish Imran',    towns:['Lahore','Gujranwala','Kasur','Sheikhupura','Pattoki','Kamonki'] },
  qaiser:  { name:'Qaiser Raza Baig',towns:['Faisalabad','Sahiwal','Okara','Pak Pattan','Burewala'] },
  sajid:   { name:'Sajid Subhani',   towns:['Rawalpindi','Wah Cantt','Chakwal','Dina','Lalamusa','Bhimber','Gujrat','Sargodha','Mandi Bahauddin','Phalia','Jhang Saddar','Pirmahal','Mianwali','DI Khan','Bannu','Layyah','Hafizabad','Wazirabad','Sialkot','Narowal'] },
  arif:    { name:'Arif Saeed',      towns:['Peshawar','Kohat','Mingora','Dir','Skardu','Gilgit','Mardan','Takht Bahi','Muzaffarabad','Abbottabad','Attock City','Batgram','Haripur'] }
};
const RSM_IDS = Object.keys(TOWN_DATA);
const TOWN_TO_RSM = {};
RSM_IDS.forEach(id => TOWN_DATA[id].towns.forEach(t => { TOWN_TO_RSM[t.toLowerCase()] = {rsmId:id, town:t}; }));

const USERS = {
  yaqoob:{password:'yaqoob2026', role:'rsm', rsmId:'yaqoob'},
  jamal:{password:'jamal2026', role:'rsm', rsmId:'jamal'},
  danish:{password:'danish2026', role:'rsm', rsmId:'danish'},
  qaiser:{password:'qaiser2026', role:'rsm', rsmId:'qaiser'},
  sajid:{password:'sajid2026', role:'rsm', rsmId:'sajid'},
  arif:{password:'arif2026', role:'rsm', rsmId:'arif'},
  nsm:{password:'nsm2026', role:'nsm'},
  adnan:{password:'adnan2026', role:'admin'},
  rashid:{password:'rashid2026', role:'cs'}
};

/* ============================= STATE ============================= */
let state = {
  user:null,
  loginError:'',
  rsmView:'today',       // today | yesterday | mtd
  selectedTown:null,
  todayRecord:null,
  yesterdayRecord:null,
  mtdData:null,
  loadingKey:null,
  nsmView:'daily',
  nsmDate: todayStr(),
  nsmDailyRecords:null,
  nsmMtdData:null,
  nsmLastUpdated:null,
  expandedRsm:null,
  overdueMap:null,        // RSM view: {town: {amount, asOf}}
  nsmOverdueMap:null,     // NSM view: same, across all towns
  overdueUploadResult:null,
  pastDueDocxResult:null,
  tvaQuarter:null, tvaMode:'volume', tvaSelectedTown:null, tvaRows:null, tvaExpandedRsm:null,
  tvaNationalRows:null,
  tvaUploadSubTab:'hierarchy', tvaUploadResult:null, tvaHierarchyList:null, tvaFamilyMetaList:null, tvaHierarchyFilter:'',
  adminUploadSubTab:'docx',
  customerTownMapList:null,
  lastDocxInvoiceRows:null,
  lastDocxDate:null,
  overdueUploadDate:null, // admin Upload tab: which date is being edited
  overdueForDate:null     // admin Upload tab: exact values already saved for that date
};

/* ============================= SESSION PERSISTENCE ============================= */
// Keeps the logged-in user and current screen across a page refresh.
// This deploys as a standalone site (GitHub Pages), so localStorage works normally
// in the actual browser it's installed/opened in.
const SESSION_KEY = 'dil_portal_session_v1';
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      user: state.user,
      rsmView: state.rsmView,
      selectedTown: state.selectedTown,
      nsmView: state.nsmView,
      nsmDate: state.nsmDate,
      expandedRsm: state.expandedRsm
    }));
  }catch(e){ /* private browsing / storage disabled — degrade gracefully, no persistence */ }
}
function restoreSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.user) state.user = s.user;
    if(s.rsmView) state.rsmView = s.rsmView;
    if(s.selectedTown) state.selectedTown = s.selectedTown;
    if(s.nsmView) state.nsmView = s.nsmView;
    if(s.nsmDate) state.nsmDate = s.nsmDate;
    if(s.expandedRsm) state.expandedRsm = s.expandedRsm;
  }catch(e){ /* corrupted or unavailable session data — start fresh */ }
}

/* ============================= HELPERS ============================= */
function todayStr(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}
function prettyDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmt(n){
  n = Number(n)||0;
  return 'Rs ' + Math.round(n).toLocaleString('en-US');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function emptyRecord(){ return {plans:{}, entries:{}}; }
function firstOfMonth(iso){ const d=new Date(iso+'T00:00:00'); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10); }
/* Fiscal year starts July 1 (matches Target vs Achievement's Jul-Sep = Q1 convention) */
function fiscalYearStart(iso){
  const d = new Date(iso+'T00:00:00');
  const y = d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear()-1; // before July -> previous fiscal year
  return new Date(y, 6, 1).toISOString().slice(0,10);
}
function daysBetweenInclusive(fromIso, toIso){
  const a=new Date(fromIso+'T00:00:00'), b=new Date(toIso+'T00:00:00');
  return Math.round((b-a)/86400000)+1;
}
function fmtEntryTime(iso){
  return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* ---- build a {plans:{town:amt}, entries:{town:[{id,amount,note,time}]}} record from raw rows ---- */
function buildRecord(plansRows, entriesRows, rsmId, date){
  const rec = emptyRecord();
  plansRows.filter(p=>p.rsm_id===rsmId && p.plan_date===date).forEach(p=> rec.plans[p.town]=Number(p.amount));
  entriesRows.filter(e=>e.rsm_id===rsmId && e.entry_date===date).forEach(e=>{
    rec.entries[e.town] = rec.entries[e.town] || [];
    rec.entries[e.town].push({id:e.id, amount:Number(e.amount), note:e.note, time: fmtEntryTime(e.entry_time)});
  });
  return rec;
}

/* ---- single-day fetch for one RSM (today / yesterday tabs) ---- */
async function getRecord(rsmId, date){
  if(!sb) return emptyRecord();
  const [plansRes, entriesRes] = await Promise.all([
    sb.from('payment_plans').select('*').eq('rsm_id',rsmId).eq('plan_date',date),
    sb.from('payment_entries').select('*').eq('rsm_id',rsmId).eq('entry_date',date).order('entry_time',{ascending:true})
  ]);
  if(plansRes.error) console.error(plansRes.error);
  if(entriesRes.error) console.error(entriesRes.error);
  return buildRecord(plansRes.data||[], entriesRes.data||[], rsmId, date);
}
async function refreshTodayRecord(){
  state.todayRecord = await getRecord(state.user.rsmId, todayStr());
}

/* ---- mutations ---- */
async function dbSetPlan(rsmId, town, date, amount){
  const {error} = await sb.from('payment_plans')
    .upsert({rsm_id:rsmId, town, plan_date:date, amount}, {onConflict:'rsm_id,town,plan_date'});
  if(error){ alert('Could not save plan: '+error.message); return false; }
  return true;

// Each morning's upload is a COMPLETE snapshot of who's overdue — not additive to
// history. So: find the single most recent date (<= today) that has any upload at
// all, then show exactly that date's towns. A town that isn't in that batch is
// treated as cleared (0), even if it had a balance on an earlier date — it is NOT
// carried forward. If HO hasn't uploaded anything yet today, the last full snapshot
// (e.g. yesterday's) keeps showing until a new one replaces it.
async function fetchLatestOverdueDate(){
  if(!sb) return null;
  const {data, error} = await sb.from('overdue_amounts').select('as_of_date')
    .lte('as_of_date', todayStr()).order('as_of_date',{ascending:false}).limit(1);
  if(error || !data || !data.length) return null;
  return data[0].as_of_date;
}
async function fetchOverdueMap(rsmId){
  if(!sb) return {};
  const latestDate = await fetchLatestOverdueDate();
  if(!latestDate) return {};
  let q = sb.from('overdue_amounts').select('*').eq('as_of_date', latestDate);
  if(rsmId) q = q.eq('rsm_id', rsmId);
  const {data, error} = await q;
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=>{
    map[r.town] = {
      amount:Number(r.amount)||0,
      due2:Number(r.due_2_days)||0,
      due5:Number(r.due_5_days)||0,
      due10:Number(r.due_10_days)||0,
      asOf:r.as_of_date
    };
  });
  return map;
}
function overdueTotal(map){ return Object.values(map||{}).reduce((s,v)=>s+v.amount,0); }
function agingTotals(map){
  const out = {due2:0, due5:0, due10:0, overdue:0};
  Object.values(map||{}).forEach(v=>{ out.due2+=v.due2||0; out.due5+=v.due5||0; out.due10+=v.due10||0; out.overdue+=v.amount||0; });
  return out;
}

async function uploadOverdueBulk(text, date){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const matched = [], unmatched = [];
  lines.forEach(line=>{
    const parts = line.split(/[,\t]/).map(p=>p.trim());
    if(parts.length<5) { unmatched.push(line); return; }
    const [rawTown, rawDue2, rawDue5, rawDue10, rawOverdue] = parts;
    const due2 = Number(String(rawDue2).replace(/,/g,''));
    const due5 = Number(String(rawDue5).replace(/,/g,''));
    const due10 = Number(String(rawDue10).replace(/,/g,''));
    const overdue = Number(String(rawOverdue).replace(/,/g,''));
    const hit = TOWN_TO_RSM[rawTown.toLowerCase()];
    if(!hit || [due2,due5,due10,overdue].some(isNaN)){ unmatched.push(line); return; }
    matched.push({rsm_id:hit.rsmId, town:hit.town, as_of_date:date, due_2_days:due2, due_5_days:due5, due_10_days:due10, amount:overdue});
  });
  if(matched.length){
    const {error} = await sb.from('overdue_amounts').upsert(matched, {onConflict:'town,as_of_date'});
    if(error){ return {ok:false, error:error.message}; }
  }
  return {ok:true, matchedCount:matched.length, unmatched};
}

/* ---- Past Due Invoice Report (.docx) — direct upload, no manual conversion ----
   Parses the exact ERP export format: "Customer Name: X   Customer Number: Y"
   header lines, followed by invoice rows ending in Balance Due and Days Past Due.
   Town is inferred from "(Town)" in the customer name, or a known-town suffix. */
const CUSTOMER_LINE_RE = /^Customer Name:\s+(.+?)\s+Customer Number:\s+(\d+)\s*$/;
const INVOICE_LINE_RE = /^(\d+)\s+(\S+)\s+(.*?)\s+(\d{2}-[A-Z]{3}-\d{2})\s+(\d{2}-[A-Z]{3}-\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+(-?\d+)\s*$/;

function findTownFromCustomerName(customerName){
  // Common spelling variants seen in ERP customer records vs. this app's
  // canonical town list — extend as new variants show up in future uploads.
  const TOWN_ALIASES = {
    'takht bhai':'Takht Bahi', 'mian chunnu':'Mian Channu', 'mian chunno':'Mian Channu',
    'wah cantt.':'Wah Cantt', 'wah cantonment':'Wah Cantt', 'd.g. khan':'Dera Ghazi Khan',
    'd.i. khan':'DI Khan', 'dera ismail khan':'DI Khan', 'ahmedpur east':'Ahmedpur East',
    'ahmed pur east':'Ahmedpur East', 'vihari':'Vehari', 'rawal pindi':'Rawalpindi',
    'pak patan':'Pak Pattan', 'pak patan shrif':'Pak Pattan', 'kamoki':'Kamonki'
  };
  const stripped = customerName.trim().replace(/\.+$/,'').trim();
  const parenMatch = stripped.match(/\(([^)]+)\)\s*$/);
  if(parenMatch){
    const cand = parenMatch[1].trim().toLowerCase();
    if(TOWN_TO_RSM[cand]) return TOWN_TO_RSM[cand].town;
    if(TOWN_ALIASES[cand]) return TOWN_ALIASES[cand];
    return null; // parenthetical present but not a known town or alias — don't guess
  }
  const nameUpper = stripped.toUpperCase();
  const knownTowns = Object.values(TOWN_TO_RSM).map(v=>v.town);
  const sortedByLen = [...knownTowns].sort((a,b)=>b.length-a.length);
  for(const t of sortedByLen){
    if(nameUpper.endsWith(t.toUpperCase())) return t;
  }
  return null;
}

/* Resolves each invoice row's town — checking the manual assignment map
   FIRST, falling back to the paren/alias/suffix guess only if unmapped —
   then buckets and sums by town. Shared by the initial upload and by
   re-processing after a manual assignment is saved. */
function aggregateInvoiceRows(invoiceRows, customerTownMap){
  const townTotals = {};
  const unmatchedCustomers = {};
  invoiceRows.forEach(r=>{
    const mapped = customerTownMap[r.customer];
    const town = (mapped && mapped.town) || findTownFromCustomerName(r.customer);
    const bucket = r.days>=0 ? 'overdue' : (r.days>=-2 ? 'due2' : r.days>=-5 ? 'due5' : r.days>=-10 ? 'due10' : null);
    if(bucket===null) return;
    if(!town){ unmatchedCustomers[r.customer] = (unmatchedCustomers[r.customer]||0) + r.balance; return; }
    if(!townTotals[town]) townTotals[town] = {due2:0, due5:0, due10:0, overdue:0};
    townTotals[town][bucket] += r.balance;
  });
  return {townTotals, unmatchedCustomers};
}

async function parsePastDueDocx(file){
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer});
  const lines = result.value.split('\n').map(l=>l.replace(/\r$/,''));

  let currentCustomer = null;
  const customerOrder = [];
  const seenCustomers = new Set();
  const invoiceRows = [];        // {customer, days, balance}

  lines.forEach(line=>{
    if(!line.trim()) return;
    const cm = CUSTOMER_LINE_RE.exec(line.trim());
    if(cm){
      currentCustomer = cm[1].trim();
      if(!seenCustomers.has(currentCustomer)){ seenCustomers.add(currentCustomer); customerOrder.push(currentCustomer); }
      return;
    }
    const im = INVOICE_LINE_RE.exec(line.trim());
    if(im && currentCustomer){
      const balanceDue = Number(im[8].replace(/,/g,''));
      const daysPastDue = Number(im[9]);
      invoiceRows.push({customer:currentCustomer, days:daysPastDue, balance:balanceDue});
    }
  });

  return { invoiceRows, customerCount: customerOrder.length };
}

async function aggregateAndUpload(townTotals, unmatchedCustomers, date, extra){
  const rows = Object.entries(townTotals).map(([town, b])=>{
    const hit = TOWN_TO_RSM[town.toLowerCase()];
    return {rsm_id:hit.rsmId, town:hit.town, as_of_date:date, due_2_days:b.due2, due_5_days:b.due5, due_10_days:b.due10, amount:b.overdue};
  });
  if(rows.length){
    const {error} = await sb.from('overdue_amounts').upsert(rows, {onConflict:'town,as_of_date'});
    if(error) return {ok:false, error:error.message};
  }
  const unmatchedList = Object.entries(unmatchedCustomers)
    .sort((a,b)=>b[1]-a[1])
    .map(([cust, bal])=>({customer:cust, balance:bal}));
  return { ok:true, matchedCount: rows.length, unmatched: unmatchedList, ...extra };
}

async function uploadPastDueDocx(file, date){
  const [parsed, customerTownMap] = await Promise.all([parsePastDueDocx(file), fetchCustomerTownMap()]);
  state.lastDocxInvoiceRows = parsed.invoiceRows; // cached so a manual town assignment can re-aggregate without re-uploading
  state.lastDocxDate = date;
  const {townTotals, unmatchedCustomers} = aggregateInvoiceRows(parsed.invoiceRows, customerTownMap);
  return await aggregateAndUpload(townTotals, unmatchedCustomers, date, {
    customerCount: parsed.customerCount,
    invoiceCount: parsed.invoiceRows.length
  });
}

/* Re-runs aggregation on the last uploaded file's cached invoice rows, using
   the current (just-updated) customer→town map — so assigning a town takes
   effect immediately without re-uploading the .docx. */
async function reprocessLastDocxUpload(){
  if(!state.lastDocxInvoiceRows) return {ok:false, error:'No cached upload to reprocess — re-upload the .docx first.'};
  const customerTownMap = await fetchCustomerTownMap();
  const {townTotals, unmatchedCustomers} = aggregateInvoiceRows(state.lastDocxInvoiceRows, customerTownMap);
  return await aggregateAndUpload(townTotals, unmatchedCustomers, state.lastDocxDate, {
    invoiceCount: state.lastDocxInvoiceRows.length
  });
}

function townTotals(rec, town){
  const plan = (rec.plans && rec.plans[town]) || 0;
  const entries = (rec.entries && rec.entries[town]) || [];
  const received = entries.reduce((s,e)=>s+Number(e.amount||0),0);
  return {plan, received, variance: received-plan, entries};
}
function achievementPct(plan, received){
  if(plan<=0) return received>0 ? 100 : 0;
  return (received/plan)*100;
}
function meterColor(pct){
  if(pct>=100) return 'var(--green)';
  if(pct>=60) return 'var(--blue)';
  if(pct>0) return 'var(--amber)';
  return '#D7DBE4';
}

/* ---- auto-refresh: RSM's Today view re-pulls overdue + own entries on an interval ----
   Paused whenever a town's entry screen is open, so a background refresh never wipes
   out an amount the RSM is mid-typing before they hit Add. ---- */
let rsmPollTimer = null;
const RSM_POLL_MS = 20000;
function ensureRsmPolling(){
  if(rsmPollTimer) return;
  rsmPollTimer = setInterval(pollRsmBody, RSM_POLL_MS);
}
function stopRsmPolling(){
  if(rsmPollTimer){ clearInterval(rsmPollTimer); rsmPollTimer=null; }
}
async function pollRsmBody(){
  if(!state.user || state.user.role!=='rsm') return;
  if(state.rsmView!=='today' || state.selectedTown) return; // don't disturb an open entry screen
  const body = document.getElementById('rsmBody');
  if(!body) return;
  const rsmId = state.user.rsmId;
  const [rec, overdueMap] = await Promise.all([
    getRecord(rsmId, todayStr()),
    fetchOverdueMap(rsmId)
  ]);
  state.todayRecord = rec;
  state.overdueMap = overdueMap;
  body.innerHTML = renderRsmToday();
}

function escJs(s){ return esc(s).replace(/'/g,"\\'"); }

function renderRsmToday(){
  const towns = TOWN_DATA[state.user.rsmId].towns;
  const rec = state.todayRecord;
  const overdueMap = state.overdueMap || {};

  if(state.selectedTown){ return renderTownEntryScreen(rec); }

  let totPlan=0, totRecv=0;
  towns.forEach(t=>{ const tt=townTotals(rec,t); totPlan+=tt.plan; totRecv+=tt.received; });
  const pct = achievementPct(totPlan, totRecv);
  const aging = agingTotals(overdueMap);
  const overdueAsOf = Object.values(overdueMap)[0] ? Object.values(overdueMap)[0].asOf : null;

  const sortedTowns = [...towns].sort((a,b)=>((overdueMap[b]?.amount||0)-(overdueMap[a]?.amount||0)));

  return `
  <div class="cards-row">
    <div class="stat-card"><div class="stat-label">Today's Plan</div><div class="stat-value">${fmt(totPlan)}</div></div>
    <div class="stat-card"><div class="stat-label">Received So Far</div><div class="stat-value">${fmt(totRecv)}</div></div>
    <div class="stat-card"><div class="stat-label">Variance</div><div class="stat-value ${totRecv-totPlan>=0?'pos':'neg'}">${fmt(totRecv-totPlan)}</div></div>
    <div class="stat-card"><div class="stat-label">Achievement</div><div class="stat-value">${pct.toFixed(0)}%</div></div>
  </div>
  <div class="panel">
    <h3>Aging Summary <span class="cnt">${overdueAsOf?'as of '+prettyDate(overdueAsOf):'not uploaded yet'}</span></h3>
    <div class="cards-row">
      <div class="stat-card"><div class="stat-label">Due in 2 Days</div><div class="stat-value">${fmt(aging.due2)}</div></div>
      <div class="stat-card"><div class="stat-label">Due in 5 Days</div><div class="stat-value">${fmt(aging.due5)}</div></div>
      <div class="stat-card"><div class="stat-label">Due in 10 Days</div><div class="stat-value">${fmt(aging.due10)}</div></div>
      <div class="stat-card" style="border-color:${aging.overdue>0?'#EFC9C3':'var(--line)'};">
        <div class="stat-label">Total Overdue</div>
        <div class="stat-value ${aging.overdue>0?'neg':''}">${fmt(aging.overdue)}</div>
      </div>
    </div>
  </div>
  <div class="panel">
    <h3>Your Towns <span class="cnt">tap a town to enter · sorted by overdue</span></h3>
    <div class="town-grid">
      ${sortedTowns.map(t=>{
        const tt = townTotals(rec,t);
        const od = overdueMap[t] ? overdueMap[t].amount : 0;
        const status = tt.plan===0 && tt.entries.length===0 ? {l:'Not started',c:'gray'}
          : tt.entries.length===0 ? {l:'Plan set',c:'amber'}
          : tt.received>=tt.plan ? {l:'Achieved',c:'green'}
          : {l:'Reporting',c:'blue'};
        return `<button class="town-card" onclick="selectTown('${escJs(t)}')">
          <span class="tc-badge"><span class="badge badge-${status.c}">${status.l}</span></span>
          <span class="tc-name">${esc(t)}</span>
          <span class="tc-nums"><span>Plan</span><b>${fmt(tt.plan)}</b></span>
          <span class="tc-nums"><span>Received</span><b>${fmt(tt.received)}</b></span>
          <span class="tc-nums" style="${od>0?'color:var(--red);':''}"><span>Overdue</span><b style="${od>0?'color:var(--red);':''}">${fmt(od)}</b></span>
        </button>`;
      }).join('')}
    </div>
  </div>
  <div class="panel">
    <h3>Town-wise Aging <span class="cnt">for follow-up planning</span></h3>
    <table class="responsive-table">
      <thead><tr><th>Town</th><th class="num">Due in 2 Days</th><th class="num">Due in 5 Days</th><th class="num">Due in 10 Days</th><th class="num">Overdue</th></tr></thead>
      <tbody>
      ${sortedTowns.map(t=>{

          <td class="num" data-label="Due in 10 Days">${fmt(a.due10)}</td>
          <td class="num ${a.amount>0?'neg':''}" data-label="Overdue">${fmt(a.amount)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;

  const overdueBanner = hasAging ? `

    body = `
    ${overdueBanner}
    <div class="plan-set-box">
      <div>Plan: <span class="amt">${fmt(tt.plan)}</span></div>
      <button class="link-btn" onclick="editPlan()">edit</button>

      <input id="amtInput" class="amount-input-lg" type="number" inputmode="decimal" placeholder="0" style="margin-bottom:10px;">
      <input id="noteInput" placeholder="Note (optional) — distributor / channel">

    </div>
    <div class="panel">
      <h3>Entries Today <span class="cnt">${tt.entries.length}</span></h3>
      ${tt.entries.length===0 ? '<div class="empty-note">No receipts logged yet for this town.</div>' :
        tt.entries.map(e=>`
        <div class="entry-row">

async function handleOverdueUpload(){
  const date = state.overdueUploadDate || todayStr();
  const text = document.getElementById('overdueInput').value;
  if(!text.trim()){ alert('Paste at least one Town, Amount line first.'); return; }
  const result = await uploadOverdueBulk(text, date);
  if(!result.ok){ alert('Upload failed: '+result.error); return; }
  state.overdueUploadResult = result;
  state.overdueForDate = await fetchOverdueForDate(date);
  state.nsmOverdueMap = await fetchOverdueMap(null); // refresh the "latest" map used on dashboards
  render();
}

async function handlePastDueDocxUpload(file){
  if(!file) return;
  const date = state.overdueUploadDate || todayStr();
  const statusEl = document.getElementById('docxUploadStatus');
  statusEl.innerHTML = '<div class="loading">Reading and processing the report — this can take a few seconds for large files…</div>';
  try{
    const result = await uploadPastDueDocx(file, date);
    if(!result.ok){ statusEl.innerHTML = `<div class="err">Upload failed: ${esc(result.error)}</div>`; return; }
    state.pastDueDocxResult = result;
    state.overdueForDate = await fetchOverdueForDate(date);
    state.nsmOverdueMap = await fetchOverdueMap(null);
    statusEl.innerHTML = '';
    render();
  }catch(e){
    statusEl.innerHTML = `<div class="err">Could not process this file: ${esc(e.message||String(e))}. Make sure it's the unmodified .docx export from your ERP.</div>`;
  }
}

async function handleAssignCustomerTown(customerName, town){
  if(!town){ alert('Choose a town first.'); return; }
  const res = await saveCustomerTownMapping(customerName, town);
  if(!res.ok){ alert('Could not save: '+res.error); return; }
  const reprocessResult = await reprocessLastDocxUpload();
  if(reprocessResult && reprocessResult.ok){
    state.pastDueDocxResult = reprocessResult;
    state.overdueForDate = await fetchOverdueForDate(state.lastDocxDate);
    state.nsmOverdueMap = await fetchOverdueMap(null);
  }
  state.customerTownMapList = await fetchCustomerTownMapList();
  render();
}
async function handleAddCustomerTownMapping(){
  const customerName = document.getElementById('newMappingCustomer').value.trim();
  const town = document.getElementById('newMappingTown').value;
  if(!customerName || !town){ alert('Enter a customer name and choose a town.'); return; }
  const res = await saveCustomerTownMapping(customerName, town);
  if(!res.ok){ alert('Could not save: '+res.error); return; }
  state.customerTownMapList = await fetchCustomerTownMapList();
  render();
}
async function handleDeleteCustomerTownMapping(customerName){
  if(!confirm(`Remove the town assignment for "${customerName}"?`)) return;
  const res = await deleteCustomerTownMapping(customerName);
  if(!res.ok){ alert('Could not remove: '+res.error); return; }
  state.customerTownMapList = await fetchCustomerTownMapList();
  render();
}
async function fetchCustomerTownMapList(){
  if(!sb) return [];
  const {data, error} = await sb.from('customer_town_map').select('*').order('customer_name');
  if(error){ console.error(error); return []; }
  return data||[];
}

/* ---- auto-refresh: NSM dashboard re-pulls data on an interval so figures update live ---- */
let nsmPollTimer = null;
const NSM_POLL_MS = 20000; // 20s — frequent enough to feel live, light on Supabase reads
function ensureNsmPolling(){
  if(nsmPollTimer) return;
  nsmPollTimer = setInterval(pollNsmBody, NSM_POLL_MS);
}
function stopNsmPolling(){
  if(nsmPollTimer){ clearInterval(nsmPollTimer); nsmPollTimer=null; }
}
async function pollNsmBody(){
  if(!state.user || (state.user.role!=='nsm' && state.user.role!=='admin')) return;
  if(state.nsmView==='upload' || state.nsmView==='achievement' || state.nsmView==='tvaupload') return; // these tabs manage their own data — never let the daily/MTD poll overwrite them
  const body = document.getElementById('nsmBody');
  if(!body) return; // NSM screen not currently mounted
  state.nsmOverdueMap = await fetchOverdueMap(null); // always pick up the latest "as of" overdue upload
  if(state.nsmView==='daily'){
    state.nsmDailyRecords = await loadNsmDailyAll(state.nsmDate);
    state.nsmLastUpdated = new Date();
    body.innerHTML = renderNsmDaily();
  } else {
    if(state.nsmMtdMode==='ytd'){
      const r = await loadNsmYtdAll(); state.nsmYtdData = r.data;
    } else {
      state.nsmMtdData = await loadNsmMtdAll();
    }
    state.nsmLastUpdated = new Date();
    body.innerHTML = renderNsmMtd();
  }
}

async function loadNsmView(){
  ensureNsmPolling();
  const body = document.getElementById('nsmBody');
  if(state.nsmView==='upload'){
    if(!state.overdueUploadDate) state.overdueUploadDate = todayStr();
    if(!state.overdueForDate) state.overdueForDate = await fetchOverdueForDate(state.overdueUploadDate);
    if(!state.customerTownMapList) state.customerTownMapList = await fetchCustomerTownMapList();
    body.innerHTML = renderNsmUpload();
    return;
  }
  if(state.nsmView==='achievement'){
    await loadNsmAchievementView();
    return;
  }
  if(state.nsmView==='tvaupload'){
    await loadTvaUploadView();
    return;
  }
  if(!state.nsmOverdueMap) state.nsmOverdueMap = await fetchOverdueMap(null);
  if(state.nsmView==='daily'){
    if(!state.nsmDailyRecords){ state.nsmDailyRecords = await loadNsmDailyAll(state.nsmDate); state.nsmLastUpdated = new Date(); }
    body.innerHTML = renderNsmDaily();
  } else {
    if(!state.nsmMtdMode) state.nsmMtdMode = 'mtd';
    if(state.nsmMtdMode==='ytd'){
      if(!state.nsmYtdData){ const r = await loadNsmYtdAll(); state.nsmYtdData = r.data; state.nsmLastUpdated = new Date(); }
    } else {
      if(!state.nsmMtdData){ state.nsmMtdData = await loadNsmMtdAll(); state.nsmLastUpdated = new Date(); }
    }
    body.innerHTML = renderNsmMtd();
  }
}

let tvaCache = { hierarchy:null, familyMeta:null };

async function fetchProductHierarchyV4(force){
  if(tvaCache.hierarchy && !force) return tvaCache.hierarchy;
  if(!sb) return {};
  const {data, error} = await sb.from('product_hierarchy_v4').select('*');
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.sku_code] = {sku_name:r.sku_name, family:r.family});
  tvaCache.hierarchy = map;
  return map;
}
async function fetchFamilyMeta(force){
  if(tvaCache.familyMeta && !force) return tvaCache.familyMeta;
  if(!sb) return {};
  const {data, error} = await sb.from('family_category').select('*');
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family] = {
    category: r.category, subtotalUom: r.subtotal_uom, price: Number(r.price)||0,
    conversionFactor: r.conversion_factor!=null ? Number(r.conversion_factor) : null,
    priceNeedsReview: !!r.price_needs_review
  });
  tvaCache.familyMeta = map;
  return map;
}
async function fetchQuarterlyTarget(quarter, town){
  if(!sb) return {};
  const {data, error} = await sb.from('quarterly_target').select('*').eq('quarter',quarter).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family] = (map[r.family]||0) + Number(r.target_qty||0));
  return map;
}
async function fetchQuarterlyTargetBulk(quarter, towns){
  if(!sb) return {};
  const data = await fetchAllPaged(()=> sb.from('quarterly_target').select('*').eq('quarter',quarter).in('town', towns));
  const byTown = {};
  data.forEach(r=>{ (byTown[r.town]=byTown[r.town]||{})[r.family] = (byTown[r.town][r.family]||0) + Number(r.target_qty||0); });

}
async function fetchAchievementQtyV2(month, metric, town){
  if(!sb) return {};
  const {data, error} = await sb.from('monthly_achievement_primary_v2').select('*').eq('month',month).eq('metric',metric).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.sku_code] = (map[r.sku_code]||0) + Number(r.qty||0));

}
async function fetchAchievementQtyV2Bulk(month, metric, towns){
  if(!sb) return {};
  const data = await fetchAllPaged(()=> sb.from('monthly_achievement_primary_v2').select('*').eq('month',month).eq('metric',metric).in('town', towns));
  const byTown = {};
  data.forEach(r=>{ (byTown[r.town]=byTown[r.town]||{})[r.sku_code] = (byTown[r.town][r.sku_code]||0) + Number(r.qty||0); });
  return byTown;
}
/* Paginates past Supabase's 1000-row response cap — see earlier fix, same principle applies here. */
async function fetchAllPaged(queryBuilderFn){
  const pageSize = 1000;
  let offset = 0, all = [];
  while(true){
    const {data, error} = await queryBuilderFn().range(offset, offset+pageSize-1);
    if(error){ console.error(error); return all; }
    all = all.concat(data||[]);
    if(!data || data.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

const QUARTER_MONTHS = {
  '2026-Q1': ['2026-07','2026-08','2026-09'],
  '2026-Q2': ['2026-10','2026-11','2026-12'],
  '2027-Q3': ['2027-01','2027-02','2027-03'],

};

const TVA_MONTH_OPTIONS = Object.values(QUARTER_MONTHS).flat();
function tvaQuarterLabel(q){
  const months = QUARTER_MONTHS[q];

  return `${label(months[0])}–${label(months[2])} ${months[0].split('-')[0]}`;
}
function tvaMonthShort(m){
  const [y,mo] = m.split('-');
  return new Date(Number(y), Number(mo)-1, 1).toLocaleDateString('en-GB',{month:'short', year:'2-digit'});
}
function tvaMonthLabel(m){

  return new Date(Number(y), Number(mo)-1, 1).toLocaleDateString('en-GB',{month:'long', year:'numeric'});

function tvaFmtRs(n){ n=Number(n)||0; return 'Rs '+Math.round(n).toLocaleString('en-US'); }

/* Which months in this quarter have ANY achievement (orders) uploaded yet,
   company-wide — same "active months" concept as before, but now gated on
   achievement data rather than target (per your point 14: Sept shows once
   at least orders are uploaded for it). Cached per quarter. */
let tvaActiveMonthsCache = {};
async function getActiveMonths(quarter){
  if(tvaActiveMonthsCache[quarter]) return tvaActiveMonthsCache[quarter];
  const months = QUARTER_MONTHS[quarter];
  const checks = await Promise.all(months.map(async m=>{
    const {data, error} = await sb.from('monthly_achievement_primary_v2').select('month').eq('month', m).eq('metric','orders').limit(1);
    if(error){ console.error(error); return null; }
    return (data && data.length) ? m : null;
  }));
  const active = checks.filter(Boolean);
  const result = active.length ? active : [months[0]];
  tvaActiveMonthsCache[quarter] = result;
  return result;
}

/* Core rollup: one row per family, target + each active month's Orders/Sales,
   Total (= sum of Net Sales only, per your confirmation), Var% vs target. */
async function computeRollup(quarter, town){
  const activeMonths = await getActiveMonths(quarter);
  const [hierarchy, familyMeta, target] = await Promise.all([
    fetchProductHierarchyV4(), fetchFamilyMeta(), fetchQuarterlyTarget(quarter, town)
  ]);
  const ordersMaps = {}, salesMaps = {};
  await Promise.all(activeMonths.map(async m=>{
    ordersMaps[m] = await fetchAchievementQtyV2(m, 'orders', town);
    salesMaps[m] = await fetchAchievementQtyV2(m, 'sales', town);
  }));
  return buildRollupRows(hierarchy, familyMeta, {[town]: target}, ordersMaps, salesMaps, activeMonths, town);
}

/* Combined (multi-town) rollup — used for RSM-territory and national views.
   Uses bulk fetchers so it stays a fixed number of queries regardless of
   how many towns are in scope. */
async function computeRollupCombined(quarter, towns){
  const activeMonths = await getActiveMonths(quarter);
  const [hierarchy, familyMeta] = await Promise.all([fetchProductHierarchyV4(), fetchFamilyMeta()]);
  const targetByTown = await fetchQuarterlyTargetBulk(quarter, towns);
  const ordersMaps = {}, salesMaps = {};
  await Promise.all(activeMonths.map(async m=>{
    ordersMaps[m] = await fetchAchievementQtyV2Bulk(m, 'orders', towns);
    salesMaps[m] = await fetchAchievementQtyV2Bulk(m, 'sales', towns);
  }));
  // Sum target across all towns in scope
  const targetSummed = {};
  towns.forEach(t=>{
    const tMap = targetByTown[t] || {};
    Object.entries(tMap).forEach(([fam,val])=>{ targetSummed[fam] = (targetSummed[fam]||0) + val; });
  });
  // Sum achievement across all towns per month
  const ordersSummed = {}, salesSummed = {};
  activeMonths.forEach(m=>{
    ordersSummed[m] = {}; salesSummed[m] = {};
    towns.forEach(t=>{
      const oMap = (ordersMaps[m]||{})[t] || {};
      const sMap = (salesMaps[m]||{})[t] || {};
      Object.entries(oMap).forEach(([sku,val])=>{ ordersSummed[m][sku] = (ordersSummed[m][sku]||0) + val; });
      Object.entries(sMap).forEach(([sku,val])=>{ salesSummed[m][sku] = (salesSummed[m][sku]||0) + val; });
    });
  });
  return buildRollupRows(hierarchy, familyMeta, {__combined__: targetSummed}, ordersSummed, salesSummed, activeMonths, '__combined__');
}

function buildRollupRows(hierarchy, familyMeta, targetByScope, ordersMaps, salesMaps, activeMonths, scopeKey){
  const target = targetByScope[scopeKey] || {};
  const familyOrder = [];
  const skusByFamily = {};
  const seen = new Set();
  Object.entries(hierarchy).forEach(([sku, meta])=>{
    if(!seen.has(meta.family)){ seen.add(meta.family); familyOrder.push(meta.family); }
    (skusByFamily[meta.family] = skusByFamily[meta.family]||[]).push(sku);
  });
  return familyOrder.map(fam=>{
    const skus = skusByFamily[fam] || [];
    const meta = familyMeta[fam] || {category:fam, subtotalUom:'pcs', price:0, conversionFactor:null};
    const price = meta.price;
    const targetQty = target[fam] || 0;
    const monthData = activeMonths.map(m=>{
      let orders=0, sales=0;
      skus.forEach(sku=>{
        orders += (ordersMaps[m]||{})[sku] || 0;
        sales += (salesMaps[m]||{})[sku] || 0;
      });
      return {month:m, ordersQty:orders, ordersValue:orders*price, salesQty:sales, salesValue:sales*price};
    });
    const totalSalesQty = monthData.reduce((s,md)=>s+md.salesQty,0);
    const totalSalesValue = totalSalesQty*price;
    const targetValue = targetQty*price;
    const varPct = targetQty !== 0 ? (totalSalesQty - targetQty) / targetQty : null;
    return {
      family: fam, category: meta.category, subtotalUom: meta.subtotalUom,
      conversionFactor: meta.conversionFactor, price,
      targetQty, targetValue, months: monthData,
      totalSalesQty, totalSalesValue, varPct
    };
  });
}

/* Converts a raw pcs quantity into a category's display unit — pcs (as-is),
   gross (÷144), or litres/kg (× conversion_factor ÷ 1000). Only used for the
   category SUBTOTAL row — individual family rows always show plain pcs. */
function convertForSubtotal(qty, uom, conversionFactor){
  if(uom === 'gross') return qty / 144;
  if((uom === 'litres' || uom === 'kg') && conversionFactor) return (qty * conversionFactor) / 1000;
  return qty;
}

function renderTvaScreen_body(rows, title, onBack, townsBelow, downloadName){
  const isVal = state.tvaMode==='value';
  const fmt = isVal ? tvaFmtRs : tvaFmtQty;
  const sorted = [...rows].sort((a,b)=> a.family.localeCompare(b.family));
  const byCategory = {};
  sorted.forEach(r=> (byCategory[r.category] = byCategory[r.category]||[]).push(r));
  const categoryOrder = Object.keys(byCategory).sort((a,b)=>a.localeCompare(b));
  const activeMonths = rows.length ? rows[0].months.map(m=>m.month) : [];

  let totTarget=0, totSales=0, totDeficit=0;
  sorted.forEach(r=>{
    totTarget += isVal? r.targetValue : r.targetQty;
    totSales += isVal? r.totalSalesValue : r.totalSalesQty;
  });
  totDeficit = totSales - totTarget;

  function familyRow(r){
    const target = isVal? r.targetValue : r.targetQty;
    const total = isVal? r.totalSalesValue : r.totalSalesQty;
    const varPct = r.varPct;
    const behind = varPct!=null && varPct < 0;
    return `<tr>
      <td data-label="Product">${esc(r.family)}</td>
      <td data-label="UOM">pcs</td>
      <td class="num" data-label="Sales Quota">${fmt(target)}</td>

        <td class="num" data-label="${tvaMonthShort(md.month)} Orders">${fmt(isVal?md.ordersValue:md.ordersQty)}</td>
        <td class="num" data-label="${tvaMonthShort(md.month)} Sales">${fmt(isVal?md.salesValue:md.salesQty)}</td>`).join('')}
      <td class="num" data-label="Total Net Sales">${fmt(total)}</td>
      <td class="num" data-label="Var %" style="${behind?'color:var(--red);font-weight:700;':''}">${varPct!=null ? (varPct*100).toFixed(1)+'%' : '—'}</td>
    </tr>`;
  }
  function categorySubtotalRow(cat, familyRows){
    const uom = familyRows[0].subtotalUom;
    const convFactorFor = r => r.conversionFactor;
    let ct=0, cs=0;
    const cm = activeMonths.map(()=>({orders:0,sales:0}));
    familyRows.forEach(r=>{
      if(isVal){
        ct += r.targetValue; cs += r.totalSalesValue;
        r.months.forEach((md,i)=>{ cm[i].orders += md.ordersValue; cm[i].sales += md.salesValue; });
      } else {
        ct += convertForSubtotal(r.targetQty, uom, convFactorFor(r));
        cs += convertForSubtotal(r.totalSalesQty, uom, convFactorFor(r));
        r.months.forEach((md,i)=>{
          cm[i].orders += convertForSubtotal(md.ordersQty, uom, convFactorFor(r));
          cm[i].sales += convertForSubtotal(md.salesQty, uom, convFactorFor(r));
        });
      }
    });
    const deficit = cs - ct;
    const varPct = ct !== 0 ? deficit/ct : null;
    const displayUom = isVal ? 'Rs' : uom;
    return `<tr style="background:#E7EEF9;font-weight:700;border-top:1.5px solid #B9CBE8;border-bottom:1.5px solid #B9CBE8;">
      <td>Total ${esc(cat)}</td>
      <td>${esc(displayUom)}</td>
      <td class="num">${fmt(ct)}</td>
      ${cm.map(m=>`<td class="num">${fmt(m.orders)}</td><td class="num">${fmt(m.sales)}</td>`).join('')}
      <td class="num">${fmt(cs)}</td>
      <td class="num" style="${varPct!=null && varPct<0?'color:var(--red);':''}">${varPct!=null ? (varPct*100).toFixed(1)+'%' : '—'}</td>
    </tr>`;
  }

  return `
  <div class="entry-screen-header">
    ${onBack ? `<button class="back-btn" onclick="${onBack}">←</button>` : ''}
    <h2>${esc(title)} — ${state.tvaQuarter} (${tvaQuarterLabel(state.tvaQuarter)})</h2>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="tvaDownloadCsv('${escJs(downloadName)}')">⬇ Download CSV</button>
  </div>
  ${renderTvaQuarterSelector()}
  <div class="cards-row">
    <div class="stat-card"><div class="stat-label">Sales Quota (${tvaQuarterLabel(state.tvaQuarter)})</div><div class="stat-value">${fmt(totTarget)}</div></div>
    <div class="stat-card"><div class="stat-label">Achievement (Net Sales)</div><div class="stat-value">${fmt(totSales)}</div></div>
    <div class="stat-card" style="border-color:${totDeficit<0?'#EFC9C3':'var(--line)'};"><div class="stat-label">Deficit</div><div class="stat-value ${totDeficit<0?'neg':'pos'}">${fmt(totDeficit)}</div></div>
  </div>
  <div class="panel">
    <h3>Product-wise <span class="cnt">${categoryOrder.length} categories · ${sorted.length} products · category totals shown at the bottom of each group, in that category's own unit</span></h3>
    <div style="overflow-x:auto;">
    <table class="responsive-table">
      <thead>
        <tr>
          <th>Product</th><th>UOM</th><th class="num">Sales Quota</th>

function tvaDownloadCsv(name){
  const rows = state.tvaRows;
  if(!rows) return;
  const sorted = [...rows].sort((a,b)=> a.family.localeCompare(b.family));
  const activeMonths = rows.length ? rows[0].months.map(m=>m.month) : [];
  let header = 'Category,Product,UOM,Sales Quota Qty,Sales Quota Value';
  activeMonths.forEach(m=>{ header += `,${m} Orders Qty,${m} Orders Value,${m} Sales Qty,${m} Sales Value`; });
  header += ',Total Net Sales Qty,Total Net Sales Value,Var %\n';
  let csv = header;
  const byCategory = {};
  sorted.forEach(r=> (byCategory[r.category] = byCategory[r.category]||[]).push(r));
  const categoryOrder = Object.keys(byCategory).sort((a,b)=>a.localeCompare(b));

  function familyLine(cat, r){
    let line = `"${cat}","${r.family}",pcs,${r.targetQty.toFixed(2)},${r.targetValue.toFixed(2)}`;
    r.months.forEach(md=>{ line += `,${md.ordersQty.toFixed(2)},${md.ordersValue.toFixed(2)},${md.salesQty.toFixed(2)},${md.salesValue.toFixed(2)}`; });
    const varPctStr = r.varPct!=null ? (r.varPct*100).toFixed(2)+'%' : '';
    return line + `,${r.totalSalesQty.toFixed(2)},${r.totalSalesValue.toFixed(2)},${varPctStr}\n`;
  }
  function subtotalLine(cat, famRows){
    const uom = famRows[0].subtotalUom;
    let ct=0, cs=0, ctv=0, csv_=0;
    const cm = activeMonths.map(()=>({oq:0,ov:0,sq:0,sv:0}));
    famRows.forEach(r=>{
      ct += convertForSubtotal(r.targetQty, uom, r.conversionFactor);
      cs += convertForSubtotal(r.totalSalesQty, uom, r.conversionFactor);
      ctv += r.targetValue; csv_ += r.totalSalesValue;
      r.months.forEach((md,i)=>{
        cm[i].oq += convertForSubtotal(md.ordersQty, uom, r.conversionFactor);
        cm[i].ov += md.ordersValue;
        cm[i].sq += convertForSubtotal(md.salesQty, uom, r.conversionFactor);
        cm[i].sv += md.salesValue;
      });
    });
    const varPct = ct!==0 ? (cs-ct)/ct : null;
    let line = `"${cat}","Total ${cat}","${uom}",${ct.toFixed(2)},${ctv.toFixed(2)}`;
    cm.forEach(m=>{ line += `,${m.oq.toFixed(2)},${m.ov.toFixed(2)},${m.sq.toFixed(2)},${m.sv.toFixed(2)}`; });
    const varPctStr = varPct!=null ? (varPct*100).toFixed(2)+'%' : '';
    return line + `,${cs.toFixed(2)},${csv_.toFixed(2)},${varPctStr}\n`;
  }

  categoryOrder.forEach(cat=>{
    const famRows = byCategory[cat];
    famRows.forEach(r=> csv += familyLine(cat, r));
    csv += subtotalLine(cat, famRows);
  });

  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${name.replace(/\s+/g,'_')}_${state.tvaQuarter}_target_vs_achievement.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function handleBulkHierarchyUpload(){

  if(!text.trim()){ alert('Paste at least one line.'); return; }

async function handleTvaTargetFileUpload(file){
  if(!file) return;
  const quarter = document.getElementById('tvaTargetQuarter').value;
  const statusEl = document.getElementById('tvaTargetUploadStatus');
  statusEl.innerHTML = '<div class="loading">Processing workbook…</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const hierarchy = await fetchProductHierarchyV4();
    const rows = [];
    const unmatched = [];
    let sheetsProcessed = 0;
    for(const sheetName of wb.SheetNames){
      const town = TVA_SHEET_TOWN[sheetName];
      if(!town) continue;
      const ws = wb.Sheets[sheetName];
      const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      // find header row (contains 'Item Description') and the quarter-total column (label starts with 'Q' + matches this quarter's number)
      let headerRowIdx = -1, itemCodeCol = -1, qtyCol = -1;
      const qNum = quarter.split('-Q')[1];
      for(let r=0; r<Math.min(grid.length,10); r++){
        const row = grid[r]||[];
        const idx = row.findIndex(c=>c==='Item Description');
        if(idx>=0){ headerRowIdx = r; itemCodeCol = idx-1; break; }
      }
      if(headerRowIdx<0) continue;
      // scan a wider header band for the "Q{n} " total column (may be a couple of rows down or same row)
      for(let r=headerRowIdx; r<headerRowIdx+3 && r<grid.length; r++){
        const row = grid[r]||[];
        const idx = row.findIndex(c=> typeof c==='string' && c.replace(/\s+/g,' ').trim().toLowerCase().startsWith(`q${qNum} `));
        if(idx>=0){ qtyCol = idx; break; }
      }
      if(qtyCol<0) continue;
      sheetsProcessed++;
      for(let r=headerRowIdx+2; r<grid.length; r++){
        const row = grid[r]||[];
        const itemCode = row[itemCodeCol];
        const qty = row[qtyCol];
        if(itemCode==null || qty==null) continue;
        const code = String(itemCode).trim();
        const meta = hierarchy[code];
        if(!meta){ unmatched.push(`${code} (${town})`); continue; }
        rows.push({quarter, town, family: meta.family, target_qty: Number(qty)});
      }
    }
    // aggregate duplicates (same quarter+town+family) before upserting
    const agg = {};
    rows.forEach(r=>{
      const key = `${r.quarter}|${r.town}|${r.family}`;
      if(agg[key]) agg[key].target_qty += r.target_qty;
      else agg[key] = {...r};
    });
    const finalRows = Object.values(agg);
    const chunkSize = 1000;
    for(let i=0;i<finalRows.length;i+=chunkSize){
      const chunk = finalRows.slice(i,i+chunkSize);
      const {error} = await sb.from('quarterly_target').upsert(chunk, {onConflict:'quarter,town,family'});
      if(error){ statusEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    }
    state.tvaUploadResult = {kind:'target', ok:true, count:finalRows.length, sheets:sheetsProcessed, unmatched};
    statusEl.innerHTML = '';
    render();
  }catch(e){
    statusEl.innerHTML = `<div class="err">Could not process file: ${esc(e.message||String(e))}</div>`;
  }
}

  'bhawalnagar': 'Bahawalnagar',
  'ahmed pur east': 'Ahmedpur East',
  'mian chunnu': 'Mian Channu',
  'vihari': 'Vehari',

function tvaFindTownFromHeader(h){
  if(!h) return null;
  const s = String(h);
  const parts = s.includes('-') ? s.split('-').slice(1).join('-') : s;
  const cleaned = parts.replace(/\s*\([^)]*\)\s*$/,'').trim().replace(/,$/,'');
  const aliased = TVA_TOWN_ALIASES[cleaned.toLowerCase()];
  const hit = TOWN_TO_RSM[(aliased || cleaned).toLowerCase()];
  return hit ? hit.town : null;
}
async function handleTvaAchievementFileUpload(file){
  if(!file) return;
  const month = document.getElementById('tvaAchMonth').value;
  const metric = document.getElementById('tvaAchMetric').value;
  const statusEl = document.getElementById('tvaAchUploadStatus');
  statusEl.innerHTML = '<div class="loading">Processing workbook…</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});

    // find the header row (contains at least one 'CODE-Town' style cell) and detect
    // whether column A is a separate clean code or a combined "code-description" cell
    let headerRowIdx = -1;
    for(let r=0; r<Math.min(grid.length,10); r++){
      const row = grid[r]||[];
      if(row.some(c=> typeof c==='string' && /^\d{6,}-/.test(c))){ headerRowIdx = r; break; }
    }
    if(headerRowIdx<0){ statusEl.innerHTML = '<div class="err">Could not find the town header row in this file.</div>'; return; }
    const headerRow = grid[headerRowIdx];
    const hasCodeCol = headerRow[0] === 'Code' || headerRow[0] === null; // separate Code column sits before Name/Description
    const dataStartCol = (typeof grid[headerRowIdx+1]?.[0] === 'string' && /^\d{6,}$/.test(grid[headerRowIdx+1][0])) ? 2 : 1;
    // simplest robust rule: if col0 of a data row is a pure numeric code, there IS a separate code column (col0), town data starts further right;
    // otherwise col0 has "code-description" combined and town data starts at col1.
    const sampleDataRow = grid[headerRowIdx+1] || [];
    const col0IsPureCode = typeof sampleDataRow[0] === 'string' && /^\d+$/.test(sampleDataRow[0].trim());
    const townStartCol = col0IsPureCode ? 2 : 1;

    const townCols = {};
    for(let c=townStartCol; c<headerRow.length; c++){
      const t = tvaFindTownFromHeader(headerRow[c]);
      if(t) townCols[c] = t;
    }
    const rows = [];
    for(let r=headerRowIdx+1; r<grid.length; r++){
      const row = grid[r]; if(!row || row[0]==null) continue;
      let code;
      if(col0IsPureCode){
        code = String(row[0]).trim();
      } else {
        const raw = String(row[0]).trim();
        if(!/^\d/.test(raw)) continue; // skip footer/summary rows like "Grand total for Prod"
        code = raw.split('-')[0].trim();
      }
      if(!/^\d{6,}$/.test(code)) continue;
      Object.entries(townCols).forEach(([c,town])=>{
        const v = row[c];
        if(v!=null && v!==0) rows.push({month, metric, town, sku_code:code, qty:Number(v)});
      });
    }
    // dedupe by conflict key (sum duplicates) to avoid a same-batch upsert error
    const dedup = {};
    rows.forEach(r=>{
      const key = `${r.month}|${r.metric}|${r.town}|${r.sku_code}`;
      if(dedup[key]) dedup[key].qty += r.qty;
      else dedup[key] = {...r};
    });
    const finalRows = Object.values(dedup);

    // Clear ALL existing rows for this exact month+metric FIRST, before inserting
    // the new parse. Without this, a SKU whose true value has dropped to zero in
    // a corrected file would never get its old nonzero row overwritten — upserts
    // only touch rows that are actually written, and zero values are deliberately
    // not written (to avoid bloating the table), so a stale nonzero row could
    // otherwise sit there forever even after a fully correct re-upload.
    const {error: delError} = await sb.from('monthly_achievement_primary_v2').delete().eq('month', month).eq('metric', metric);
    if(delError){ statusEl.innerHTML = `<div class="err">Could not clear old data before uploading: ${esc(delError.message)}</div>`; return; }

    let succeeded = 0;
    const chunkErrors = [];
    const chunkSize = 1000;
    for(let i=0;i<finalRows.length;i+=chunkSize){
      const chunk = finalRows.slice(i,i+chunkSize);
      const {error} = await sb.from('monthly_achievement_primary_v2').upsert(chunk, {onConflict:'month,metric,town,sku_code'});
      if(error){ chunkErrors.push(`Rows ${i+1}-${i+chunk.length}: ${error.message}`); continue; }
      succeeded += chunk.length;
    }
    tvaActiveMonthsCache = {}; // this upload may have just made a new month "active"
    if(chunkErrors.length){
      statusEl.innerHTML = `<div class="err">${succeeded} of ${finalRows.length} rows saved. ${chunkErrors.length} chunk(s) failed — safe to re-upload the same file, already-saved rows just get overwritten with the same values.<br>${chunkErrors.map(esc).join('<br>')}</div>`;
      return;
    }
    state.tvaUploadResult = {kind:'achievement', ok:true, count:succeeded};
    statusEl.innerHTML = '';
    render();
  }catch(e){
    statusEl.innerHTML = `<div class="err">Could not process file: ${esc(e.message||String(e))}</div>`;
  }
}
/* ============================= INIT ============================= */
restoreSession();
render();
</script>
</body>
</html>
